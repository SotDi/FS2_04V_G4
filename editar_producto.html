<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo/Editar Producto - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <nav class="col-md-2 bg-dark text-white p-3 d-flex flex-column">
                <h4 class="mb-4 text-center">Level-Up Admin</h4>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item mb-2"><a href="home_admin.html" class="nav-link text-white">Dashboard</a></li>
                    <li class="nav-item mb-2"><a href="listado_productos.html" class="nav-link text-white active fw-bold">Productos</a></li>
                    <li class="nav-item mb-2"><a href="listado_usuarios.html" class="nav-link text-white">Usuarios</a></li>
                </ul>
                <a href="index.html" id="btnCerrarSesion" class="btn btn-outline-danger mt-4">Cerrar sesión</a>
            </nav>

            <main class="col-md-10 p-4 bg-light">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>NUEVO PRODUCTO</h1>
                    <a href="listado_productos.html" class="btn btn-secondary">Volver</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="formProducto" novalidate>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">ID Producto</label>
                                    <input type="number" id="idProducto" class="form-control" min="0" step="1" required>
                                    <div class="invalid-feedback">Debe ser un número entero mayor o igual a 0.</div>
                                </div>
                                <div class="col-md-8 mb-3">
                                    <label class="form-label">Nombre del Producto</label>
                                    <input type="text" id="nombreProducto" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Categoría</label>
                                    <select id="categoriaProducto" class="form-select" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Juegos de mesa">Juegos de mesa</option>
                                        <option value="Accesorios">Accesorios</option>
                                        <option value="Consolas">Consolas</option>
                                        <option value="Computadores gamers">Computadores gamers</option>
                                        <option value="Sillas gamers">Sillas gamers</option>
                                        <option value="Mouse">Mouse</option>
                                        <option value="Mousepad">Mousepad</option>
                                        <option value="Poleras personalizadas">Poleras personalizadas</option>
                                        <option value="Polerones gamers">Polerones gamers personalizados</option>
                                        <option value="Servicio técnico">Servicio técnico</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio ($)</label>
                                    <input type="number" id="precioProducto" class="form-control" min="0" step="1" required>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Imagen (Opcional)</label>
                                    <input type="file" id="imagenProducto" class="form-control" accept="image/*">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-3">GUARDAR PRODUCTO</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
