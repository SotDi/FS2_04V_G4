<!-- Define que el documento utiliza la última versión de HTML (HTML5). Requerido por el navegador. -->
<!DOCTYPE html>
<!-- Inicia el documento e indica que el idioma es español. Ayuda al SEO y traductores. -->
<html lang="es">
<!-- Cabecera del documento: Aquí va la configuración invisible para el usuario. -->
<head>
    <!-- Define la codificación de caracteres. Requerido para que las 'ñ' y tildes se vean bien. -->
    <meta charset="UTF-8">
    <!-- Ajusta el ancho de la página al dispositivo. Requerido para el "Diseño Responsivo". -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El título que aparecerá en la pestaña del navegador web. -->
    <title>Dashboard Admin - Level-Up Gamer</title>

    <!-- LLAMADA A BOOTSTRAP (CSS): Importa los estilos visuales y la grilla. Requerido para maquetar rápido. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- LLAMADA A TU CSS EXTERNO: Aquí sobreescribirás colores (ej. fondo negro, letras gris claro). Requerido por la pauta. -->
    <link rel="stylesheet" href="css/style.css">
</head>

<!-- Cuerpo del documento: Todo lo visible en la página web. -->
<body>

    <!-- Contenedor fluido de Bootstrap: Ocupa el 100% del ancho de la pantalla. Requerido para el diseño del dashboard. -->
    <div class="container-fluid">
        <!-- Fila (row) de Bootstrap que define que el contenido interno ocupará mínimo el 100% del alto de la pantalla (min-vh-100). -->
        <div class="row min-vh-100">

            <!-- MENÚ LATERAL (Sidebar): Etiqueta <nav> semántica. En escritorio ocupa 2 de 12 columnas (col-md-2), fondo oscuro (bg-dark). Requerido por la pauta. -->
            <nav class="col-md-2 bg-dark text-white p-3 d-flex flex-column">
                
                <!-- Título del menú lateral. -->
                <h4 class="mb-4 text-center">Level-Up Admin</h4>

                <!-- Lista de enlaces para la navegación del administrador. -->
                <ul class="nav flex-column mb-auto">
                    <!-- Elemento de la lista para el Dashboard (Vista actual). -->
                    <li class="nav-item mb-2">
                        <!-- Enlace activo señalando que estamos en el inicio. -->
                        <a href="home_admin.html" class="nav-link text-white active">🏠 Dashboard</a>
                    </li>
                    <!-- Elemento de la lista para ir a gestionar los productos. -->
                    <li class="nav-item mb-2">
                        <!-- Enlace hacia la vista del listado de productos. -->
                        <a href="listado_productos.html" class="nav-link text-white">📦 Productos</a>
                    </li>
                    <!-- Elemento de la lista para ir a gestionar los usuarios. -->
                    <li class="nav-item mb-2">
                        <!-- Enlace hacia la vista del listado de usuarios. -->
                        <a href="listado_usuarios.html" class="nav-link text-white">👥 Usuarios</a>
                    </li>
                </ul>
                
                <!-- Botón al final del menú para salir del administrador y volver a la tienda. -->
                <a href="index.html" class="btn btn-outline-danger mt-4">Cerrar Sesión</a>
            </nav>

            <!-- CONTENIDO PRINCIPAL: Etiqueta semántica <main>. Ocupa las 10 columnas restantes (col-md-10) al centro/derecha. Requerido por la pauta. -->
            <main class="col-md-10 p-4 bg-light">
                
                <!-- Título principal de bienvenida en el panel. -->
                <h1 class="mb-4">¡HOLA Administrador!</h1>

                <!-- Fila interna para colocar tarjetas (cards) informativas en el dashboard. -->
                <div class="row">
                    <!-- Columna que ocupa 4 espacios (un tercio de la pantalla) para una tarjeta. -->
                    <div class="col-md-4 mb-3">
                        <!-- Tarjeta (Card) de Bootstrap con sombra pequeña (shadow-sm). -->
                        <div class="card shadow-sm">
                            <!-- Cuerpo de la tarjeta con el texto. -->
                            <div class="card-body">
                                <h5 class="card-title">Gestión de Inventario</h5>
                                <p class="card-text">Accede para crear, editar o eliminar productos de la tienda.</p>
                                <!-- Botón que redirige al administrador a la tabla de productos. -->
                                <a href="listado_productos.html" class="btn btn-primary">Ir a Productos</a>
                            </div>
                        </div>
                    </div>
                </div>
                
            </main>
        </div>
    </div>

    <!-- LLAMADA A BOOTSTRAP (JS): Carga los scripts necesarios justo antes de cerrar el body. Requerido para componentes interactivos móviles. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- LLAMADA A TU JS EXTERNO: Archivo funciones.js donde luego harás validaciones. Requerido para mantener HTML, CSS y JS separados. -->
    <script src="js/funciones.js"></script>
</body>
<!-- Cierre del documento HTML. -->
</html>
