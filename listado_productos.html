<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos - Level-Up Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- COMENTARIO JS: Si luego agregas DataTables para mejorar la tabla, el CSS del plugin iría aquí -->
</head>
<body>

    <!-- COMENTARIO JS: Validar acceso de Administrador en window.onload (Igual que en usuarios) -->

    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- MENÚ LATERAL (Sidebar) -->
            <nav class="col-md-2 bg-dark text-white p-3 d-flex flex-column">
                <h4 class="mb-4 text-center">Level-Up Admin</h4>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item mb-2">
                        <a href="home_admin.html" class="nav-link text-white">🏠 Dashboard</a>
                    </li>
                    <li class="nav-item mb-2">
                        <!-- Enlace Activo -->
                        <a href="listado_productos.html" class="nav-link text-white active fw-bold">📦 Productos</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="listado_usuarios.html" class="nav-link text-white">👥 Usuarios</a>
                    </li>
                </ul>
                <button id="btnCerrarSesion" class="btn btn-outline-danger mt-4">Cerrar Sesión</button>
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-10 p-4 bg-light">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Inventario de Productos</h1>
                    <!-- Botón para ir al formulario de creación -->
                    <a class="btn btn-primary" href="editar_producto.html">+ Nuevo Producto</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <!-- TABLA ESTÁTICA DE PRODUCTOS -->
                        <div class="table-responsive">
                            <table id="tablaProductos" class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Código</th>
                                        <th>Imagen</th>
                                        <th>Nombre del Producto</th>
                                        <th>Categoría</th>
                                        <th>Precio</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Fila estática de ejemplo 1 -->
                                    <tr>
                                        <td>P001</td>
                                        <td><img src="https://via.placeholder.com/50" alt="Silla Gamer" class="img-thumbnail"></td>
                                        <td>Silla Gamer Pro LevelUp</td>
                                        <td>Sillas Gamers</td>
                                        <td>$149.990</td>
                                        <td>
                                            <a href="editar_producto.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                                            <!-- COMENTARIO JS: Función para simular eliminación de producto -->
                                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarProductoJS()">Eliminar</button>
                                        </td>
                                    </tr>
                                    <!-- Fila estática de ejemplo 2 -->
                                    <tr>
                                        <td>P002</td>
                                        <td><img src="https://via.placeholder.com/50" alt="Mouse" class="img-thumbnail"></td>
                                        <td>Mouse Logitech G Pro X</td>
                                        <td>Mouse</td>
                                        <td>$99.990</td>
                                        <td>
                                            <a href="editar_producto.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarProductoJS()">Eliminar</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS y Funciones Propias -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/funciones.js"></script>
</body>
</html>
