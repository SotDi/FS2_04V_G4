<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Level-Up Gamer</title>

    <!-- Importando fuentes de Google (Orbitron y Roboto)! -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS! -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS Externo (Requisito de la pauta)! -->
    <link rel="stylesheet" href="assets/style.css">

    <!-- Estilos internos rápidos para cumplir el diseño visual exigido! -->
    <style>
        body { background-color: #000000; color: #FFFFFF; font-family: 'Roboto', sans-serif; }
        h1, h2, h3, .navbar-brand { font-family: 'Orbitron', sans-serif; }
        .btn-neon-green { background-color: #39FF14; color: #000; font-weight: bold; border: none; }
        .btn-neon-green:hover { background-color: #32e012; }
        .form-control { background-color: #1a1a1a; color: #fff; border: 1px solid #1E90FF; }
        .form-control:focus { background-color: #2a2a2a; color: #fff; border-color: #39FF14; box-shadow: 0 0 5px #39FF14; }
    </style>
</head>
<body>

    <!-- Menú de navegación oscuro! -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-primary" href="index.html">LEVEL-UP</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal de la vista! -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card bg-dark text-white shadow-lg" style="border: 1px solid #39FF14;">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4" style="color: #39FF14;">Contáctanos</h1>
                        
                        <!-- Formulario de contacto con novalidate para que JS haga el trabajo! -->
                        <form id="formContacto" novalidate>
                            
                            <!-- Campo Nombre Completo! -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <!-- Límite de 100 caracteres según regla de negocio! -->
                                <input type="text" id="nombre" class="form-control" maxlength="100" placeholder="Ingresa tu nombre">
                                <div class="invalid-feedback">El nombre es requerido.</div>
                            </div>

                            <!-- Campo Correo Electrónico! -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <!-- Límite de 100 caracteres según regla de negocio! -->
                                <input type="email" id="correo" class="form-control" maxlength="100" placeholder="ejemplo@duoc.cl">
                                <div class="invalid-feedback">Ingrese un correo válido (@duoc.cl, @profesor.duoc.cl o @gmail.com).</div>
                            </div>

                            <!-- Campo Comentario! -->
                            <div class="mb-3">
                                <label for="comentario" class="form-label">Comentario</label>
                                <!-- Límite de 500 caracteres según regla de negocio! -->
                                <textarea id="comentario" class="form-control" rows="4" maxlength="500" placeholder="Escribe tu mensaje..."></textarea>
                                <div class="invalid-feedback">El comentario es requerido.</div>
                            </div>

                            <!-- Botón de envío con color verde neón! -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-neon-green mt-3">Enviar Mensaje</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts de Bootstrap! -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Archivo JS centralizado! -->
    <script src="assets/funciones.js"></script>
</body>
</html>
