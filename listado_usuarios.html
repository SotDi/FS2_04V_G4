<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios - Level-Up Admin</title>

    <!-- LLAMADA A BOOTSTRAP CSS (Obligatorio según la pauta) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- LLAMADA A TU CSS PERSONALIZADO -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- COMENTARIO JS: Aquí podrías agregar el CSS de DataTables en el futuro si decides usar el plugin para la tabla, tal como sugiere el apunte 1.3.3 -->
</head>
<body>

    <!-- COMENTARIO JS (UNIÓN CON LOGIN): 
         Al cargar el <body>, en tu archivo funciones.js deberías tener una función que se ejecute inmediatamente (ej. window.onload).
         Esa función debe verificar en el 'localStorage' o 'sessionStorage' si existe un usuario logueado y si su rol es "Administrador". 
         Si no es administrador o no está logueado, JS debe redirigirlo automáticamente con: window.location.href = "login.html"; 
    -->

    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- MENÚ LATERAL (Sidebar) -->
            <nav class="col-md-2 bg-dark text-white p-3 d-flex flex-column">
                <h4 class="mb-4 text-center">Level-Up Admin</h4>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item mb-2">
                        <a href="home_admin.html" class="nav-link text-white">🏠 Dashboard</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="listado_productos.html" class="nav-link text-white">📦 Productos</a>
                    </li>
                    <li class="nav-item mb-2">
                        <!-- Enlace activo señalando que estamos en Usuarios -->
                        <a href="listado_usuarios.html" class="nav-link text-white active fw-bold">👥 Usuarios</a>
                    </li>
                </ul>
                
                <!-- COMENTARIO JS: A este botón le agregarás un evento 'onclick' en JS que limpie el localStorage (cerrar sesión) y redirija al index.html -->
                <button id="btnCerrarSesion" class="btn btn-outline-danger mt-4">Cerrar Sesión</button>
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-10 p-4 bg-light">
                
                <!-- Encabezado de la vista -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Gestión de Usuarios</h1>
                    <!-- Botón para ir a crear un nuevo usuario (Cumple REQ-12) -->
                    <a href="nuevo_usuario.html" class="btn btn-success">+ Nuevo Usuario</a>
                </div>

                <!-- Tarjeta que contiene la tabla (Diseño limpio y moderno) -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <!-- TABLA DE USUARIOS (Estructura estática requerida para la entrega) -->
                        <div class="table-responsive">
                            <!-- COMENTARIO JS: El 'id="tablaUsuarios"' es crucial. En tu JS usarás document.getElementById('tablaUsuarios') para manipularla o aplicarle el plugin DataTables -->
                            <table id="tablaUsuarios" class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre Completo</th>
                                        <th>Correo</th>
                                        <th>Región</th>
                                        <th>Perfil/Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Fila de ejemplo 1 -->
                                    <tr>
                                        <td>101</td>
                                        <td>Juan Pérez</td>
                                        <td>juan.perez@duocuc.cl</td>
                                        <td>Metropolitana</td>
                                        <td><span class="badge bg-primary">Administrador</span></td>
                                        <td>
                                            <!-- COMENTARIO JS: Estos botones luego pueden llamar funciones JS como editarUsuario(101) o eliminarUsuario(101) -->
                                            <a href="editar_usuario.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuarioJS()">Eliminar</button>
                                        </td>
                                    </tr>
                                    <!-- Fila de ejemplo 2 -->
                                    <tr>
                                        <td>102</td>
                                        <td>María Gómez</td>
                                        <td>maria.gomez@gmail.com</td>
                                        <td>Valparaíso</td>
                                        <td><span class="badge bg-info text-dark">Cliente</span></td>
                                        <td>
                                            <a href="editar_usuario.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuarioJS()">Eliminar</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- LLAMADA A BOOTSTRAP JS (Obligatorio para que funcionen menús, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- COMENTARIO JS: Aquí podrías agregar el JS de DataTables si decides potenciar la tabla -->
    
    <!-- LLAMADA A TU ARCHIVO JS EXTERNO (Requisito fundamental de buenas prácticas) -->
    <script src="assets/js/funciones.js"></script>

</body>
</html>
