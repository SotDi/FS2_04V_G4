<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios - Level-Up Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row min-vh-100">
            <nav class="col-md-2 bg-dark text-white p-3 d-flex flex-column">
                <h4 class="mb-4 text-center">Level-Up Admin</h4>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item mb-2">
                        <a href="home_admin.html" class="nav-link text-white">Dashboard</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="listado_productos.html" class="nav-link text-white">Productos</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="listado_usuarios.html" class="nav-link text-white active fw-bold">Usuarios</a>
                    </li>
                </ul>
                
                <button id="btnCerrarSesion" class="btn btn-outline-danger mt-4">Cerrar Sesión</button>
            </nav>

            <main class="col-md-10 p-4 bg-light">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>Gestión de Usuarios</h1>
                    <a href="nuevo_usuario.html" class="btn btn-success">+ Nuevo Usuario</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="tablaUsuarios" class="table table-striped table-hover align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre Completo</th>
                                        <th>Correo</th>
                                        <th>Región</th>
                                        <th>Perfil/Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>101</td>
                                        <td>Juan Pérez</td>
                                        <td>juan.perez@duocuc.cl</td>
                                        <td>Metropolitana</td>
                                        <td><span class="badge bg-primary">Administrador</span></td>
                                        <td>
                                            <a href="editar_usuario.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuarioJS()">Eliminar</button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>102</td>
                                        <td>María Gómez</td>
                                        <td>maria.gomez@gmail.com</td>
                                        <td>Valparaíso</td>
                                        <td><span class="badge bg-info text-dark">Cliente</span></td>
                                        <td>
                                            <a href="editar_usuario.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarUsuarioJS()">Eliminar</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
