<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo/Editar Usuario - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <nav class="col-md-2 bg-dark text-white p-3 d-flex flex-column">
                <h4 class="mb-4 text-center">Level-Up Admin</h4>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item mb-2"><a href="home_admin.html" class="nav-link text-white">Dashboard</a></li>
                    <li class="nav-item mb-2"><a href="listado_productos.html" class="nav-link text-white">Productos</a></li>
                    <li class="nav-item mb-2"><a href="listado_usuarios.html" class="nav-link text-white active fw-bold">Usuarios</a></li>
                </ul>
                <a href="index.html" id="btnCerrarSesion" class="btn btn-outline-danger mt-4">Cerrar sesión</a>
            </nav>

            <main class="col-md-10 p-4 bg-light">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>NUEVO USUARIO</h1>
                    <a href="listado_usuarios.html" class="btn btn-secondary">Volver</a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="formUsuario" novalidate>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">RUN (Sin puntos ni guion)</label>
                                    <input type="text" id="runUsuario" class="form-control" minlength="7" maxlength="9" required>
                                    <div class="invalid-feedback">RUN inválido (7 a 9 caracteres).</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" id="nombreUsuario" class="form-control" maxlength="50" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellidos</label>
                                    <input type="text" id="apellidoUsuario" class="form-control" maxlength="100" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Correo</label>
                                    <input type="email" id="correoUsuario" class="form-control" maxlength="100" required>
                                    <div class="invalid-feedback">Dominio no permitido.</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tipo de Usuario</label>
                                    <select id="tipoUsuario" class="form-select" required>
                                        <option value="">Seleccione...</option>
                                        <option value="Administrador">Administrador</option>
                                        <option value="Cliente">Cliente</option>
                                        <option value="Vendedor">Vendedor</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha Nacimiento (Opcional)</label>
                                    <input type="date" id="fechaNacimiento" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Región</label>
                                    <select id="regionUsuario" class="form-select" required>
                                        <option value="">Seleccione región...</option>
                                        <option value="RM">Región Metropolitana</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Comuna</label>
                                    <select id="comunaUsuario" class="form-select" required disabled>
                                        <option value="">Seleccione comuna...</option>
                                    </select>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Dirección</label>
                                    <textarea id="direccionUsuario" class="form-control" maxlength="300" required></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary mt-3">REGISTRAR</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
